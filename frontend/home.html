<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="./style.css">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';">
    </head>

    <body>
        <div id="seccion-registro-login" class="ocultar-display">
            <div class="menu-registro-login flex-display" id="seccion-login">
                <h2>Iniciar sesión</h2>
                <form id="form-login">
                    <label for="login-user">
                        <span>Correo electrónico</span>
                        <input id="login-user" placeholder="Usuario" required autofocus autocomplete="on">
                    </label>
                    <label for="login-pass">
                        <span>Contraseña</span>
                        <input id="login-pass" type="password" placeholder="Contraseña" required autocomplete="on">
                    </label>

                    <button>Entrar</button>
                    <span class="bt-cambio-login-registro" id="bt-cambiar-registro">¿Crear cuenta?</span>
                </form>
            </div>
            <div class="menu-registro-login ocultar-display" id="seccion-registro">
                <h2>Crear cuenta</h2>
                <form id="form-registro">
                    <label for="registro-user">
                        <span>Correo electrónico</span>
                        <input id="registro-user" placeholder="Usuario" required autofocus autocomplete="on">
                    </label>
                    <label for="registro-pass">
                        <span>Contraseña</span>
                        <input id="registro-pass" type="password" placeholder="Contraseña" required>
                    </label>
                    <label for="registro-pass-confirm">
                        <span id="span-repetir-contraseña">Repita la Contraseña</span>
                        <input id="registro-pass-confirm" type="password" placeholder="Contraseña" required>
                    </label>

                    <button>Entrar</button>
                    <span class="bt-cambio-login-registro" id="bt-cambiar-login">¿Tienes cuenta?</span>
                </form>
            </div>
        </div>
        <script defer src="./renderer.js"></script><!--CARGARLO AL FINAL DE TODO-->
    </body>

</html>
