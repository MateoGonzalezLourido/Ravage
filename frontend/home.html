<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="./style.css">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self';">
    </head>

    <body>
        <!--LOGIN/REGISTRO...-->
        <div id="seccion-registro-login" class="ocultar-display">
            <div class="menu-registro-login flex-display" id="seccion-login">
                <h2>Iniciar sesión</h2>
                <form id="form-login">
                    <label for="login-user">
                        <span>Correo electrónico</span>
                        <input id="login-user" placeholder="Usuario" required autofocus="on" autocomplete="on">
                    </label>
                    <label for="login-pass">
                        <span>Contraseña</span>
                        <input id="login-pass" type="password" placeholder="Contraseña" required autocomplete="on">
                    </label>
                    <label class="label-check" for="login-guardar">
                        <span>Mantener sesión iniciada</span>
                        <input id="login-guardar" type="checkbox" checked>
                    </label>
                    <span class="text-error-form-causa ocultar-display" id="text-error-form-causa-login"></span>
                    <button>Entrar</button>
                    <span class="bt-cambio-login-registro" id="bt-cambiar-registro">¿Crear cuenta?</span>
                </form>
            </div>
            <div class="menu-registro-login menu-registro-login ocultar-display" id="seccion-registro">
                <h2>Crear cuenta</h2>
                <form id="form-registro">
                    <label for="registro-apodo">
                        <span>Apodo (opcional)</span>
                        <input id="registro-apodo" placeholder="Apodo" autofocus="on" minlength="3" maxlength="30">
                    </label>
                    <label for="registro-user">
                        <span>Correo electrónico</span>
                        <input id="registro-user" placeholder="Usuario" required autocomplete="on">
                    </label>
                    <label for="registro-pass">
                        <span>Contraseña</span>
                        <input id="registro-pass" type="password" placeholder="Contraseña" required minlength="5"
                            autocomplete="on">
                    </label>
                    <label for="registro-pass-confirm">
                        <span id="span-repetir-contraseña">Repita la Contraseña</span>
                        <input id="registro-pass-confirm" type="password" placeholder="Contraseña" required
                            minlength="5">
                    </label>
                    <span class="text-error-form-causa ocultar-display" id="text-error-form-causa-registro"></span>
                    <button>Registrar</button>
                    <span class="bt-cambio-login-registro" id="bt-cambiar-login">¿Tienes cuenta?</span>
                </form>
            </div>
            <div class="menu-validacion-codigo ocultar-display" id="seccion-validacion-codigo-correo">
                <h2>Validar correo</h2>
                <span class="ayuda-texto">Introduzca el codigo que se ha enviado a su correo.</span>
                <span class="span-aviso">Aviso: puede que se haya enviado a spam</span>
                <span class="span-aviso">Aviso: debes poner el último código generado</span>
                <form id="form-validation-correo">
                    <input id="bt-code-introducir" type="number" value="" placeholder="123456" required
                        autocomplete="off" minlength="6" maxlength="6" autofocus="on">
                        <span class="text-error-form-causa ocultar-display" id="text-error-form-causa-codigo-validar"></span>
                    <button class="bt-validar-code">Validar</button>
                    <span class="bt-cambio-login-registro" id="bt-cambiar-login-validation-code">¿Quieres volver?</span>
                </form>
            </div>
            <div class="menu-confirmacion-cuenta-creada ocultar-display" id="seccion-confirmacion-cuenta-creada">
                <h2>Cuenta creada correctamente</h2>
                <span>Gracias por unirte a nosotros!!!</span>
                <button id="bt-volver-login-confirmacion-cuenta">Login</button>
            </div>
        </div>
        <!--MENU INICIO-->
        
        <!--SCRIPTS-->
        <script defer src="./renderer.js"></script><!--CARGARLO AL FINAL DE TODO-->
    </body>

</html>
